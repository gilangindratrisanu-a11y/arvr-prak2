<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>AR Kelompok 5 - Minggu 2</title>

  <!-- Library A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- Library AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    // Deteksi perangkat iPhone/iPad
    var isIOS =
      /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" &&
       navigator.maxTouchPoints > 1);

    // Berikan class sesuai perangkat
    document.documentElement.classList.add(
      isIOS ? "ios-ar" : "desktop-ar"
    );
  </script>

  <style>
    /* Pengaturan dasar */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    /* Laptop tetap mirror */
    html.desktop-ar body {
      transform: scaleX(-1);
    }

    /* iPhone tidak mirror */
    html.ios-ar body {
      transform: none;
    }

    /* Tampilan AR iPhone */
    html.ios-ar a-scene {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
    }

    /*
      Biarkan AR.js mengatur ukuran video dan canvas.
      Jangan paksa width atau height kamera.
    */
  </style>
</head>

<body>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="colorManagement: true; antialias: true"
    vr-mode-ui="enabled: false">

    <!-- Pencahayaan ambient -->
    <a-light
      id="cahaya-ambient"
      type="ambient"
      color="#ffffff"
      intensity="0.6">
    </a-light>

    <!-- Pencahayaan directional -->
    <a-light
      id="cahaya-directional"
      type="directional"
      color="#ffffff"
      intensity="0.8"
      position="1 3 2">
    </a-light>

    <!-- Marker Hiro -->
    <a-marker id="marker-hiro" preset="hiro">

      <!-- Alas transparan -->
      <a-plane
        id="alas-scene"
        position="0 0 0"
        rotation="-90 0 0"
        width="2"
        height="2"
        material="color: #e9e5fa; opacity: 0.7; transparent: true">
      </a-plane>

      <!-- Kelompok objek -->
      <a-entity id="kelompok-objek" position="0 0 0">

        <!-- Kubus biru -->
        <a-box
          id="kubus-biru"
          position="-0.6 0.25 0"
          width="0.5"
          height="0.5"
          depth="0.5"
          color="#4C6EF5">
        </a-box>

        <!-- Bola oranye -->
        <a-sphere
          id="bola-oranye"
          position="0 0.3 0"
          radius="0.3"
          color="#D9531E"
          material="metalness: 0.3; roughness: 0.4"
          animation="property: position;
                     dir: alternate;
                     to: 0 0.5 0;
                     dur: 1500;
                     loop: true;
                     easing: easeInOutSine">
        </a-sphere>

        <!-- Silinder hijau -->
        <a-cylinder
          id="silinder-hijau"
          position="0.6 0.3 0"
          radius="0.2"
          height="0.6"
          color="#0B7F73"
          animation="property: rotation;
                     to: 0 360 0;
                     dur: 4000;
                     loop: true;
                     easing: linear">

          <!-- Penanda rotasi -->
          <a-box
            id="penanda-silinder"
            position="0 0.15 0.2"
            width="0.08"
            height="0.08"
            depth="0.08"
            color="#FDE047">
          </a-box>

        </a-cylinder>

        <!-- Kotak bertekstur -->
        <a-box
          id="kotak-bertekstur"
          position="0 0.15 0.7"
          width="0.5"
          height="0.3"
          depth="0.5"
          material="src: url(assets/tekstur.jpg); repeat: 1 1">
        </a-box>

      </a-entity>

    </a-marker>

    <!-- Kamera AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
