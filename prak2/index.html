<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Kelompok 5 - Minggu 2</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    // Minta kamera belakang di iPhone/mobile tanpa mengubah webcam laptop.
    (function () {
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
        window.innerWidth <= 820;
      if (!isMobile || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      var originalGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = function (constraints) {
        constraints = constraints || {};
        if (constraints.video) {
          constraints.video = typeof constraints.video === 'object' ? constraints.video : {};
          if (!constraints.video.facingMode) constraints.video.facingMode = { ideal: 'environment' };
        }
        return originalGetUserMedia(constraints);
      };
    }());
  </script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script>
    // Tandai perangkat mobile / iPhone
    (function () {
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) ||
        window.innerWidth <= 820;
      if (isMobile) {
        document.documentElement.classList.add('iphone-ar');
        document.documentElement.classList.add('mobile-ar');
      }

      window.addEventListener('arjs-video-loaded', function (e) {
        if (isMobile && e.detail && e.detail.component) {
          var video = e.detail.component;
          video.style.width = '100vw';
          video.style.height = '100dvh';
          video.style.minWidth = '100vw';
          video.style.minHeight = '100dvh';
          video.style.marginLeft = '0px';
          video.style.marginTop = '0px';
          video.style.objectFit = 'cover';
        }
      });

      // Juga intercept setInterval/requestAnimationFrame atau window resize dari AR.js jika ia mencoba mereset ukuran
      window.addEventListener('resize', function () {
        if (isMobile) {
          var video = document.getElementById('arjs-video');
          var canvas = document.querySelector('.a-canvas');
          if (video) {
            video.style.width = '100vw';
            video.style.height = '100dvh';
            video.style.minWidth = '100vw';
            video.style.minHeight = '100dvh';
            video.style.marginLeft = '0px';
            video.style.marginTop = '0px';
            video.style.objectFit = 'cover';
          }
          if (canvas) {
            canvas.style.width = '100vw';
            canvas.style.height = '100dvh';
            canvas.style.marginLeft = '0px';
            canvas.style.marginTop = '0px';
          }
        }
      });
    }());
  </script>
  <style>
    /* Khusus iPhone dan perangkat mobile: kamera belakang normal (tidak mirror) dan fullscreen */
    @media screen and (max-width: 820px) {
      html, body {
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        margin: 0 !important;
        padding: 0 !important;
        overflow: hidden !important;
        transform: none !important;
      }

      #arjs-video,
      video,
      .a-canvas,
      canvas,
      a-scene {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        min-width: 100vw !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        margin: 0 !important;
        padding: 0 !important;
        max-width: none !important;
        max-height: none !important;
        border: none !important;
      }

      #arjs-video,
      video {
        object-fit: cover !important;
        object-position: center center !important;
        z-index: -2 !important;
      }

      .a-canvas,
      canvas {
        z-index: 1 !important;
      }
    }

    html.iphone-ar,
    html.iphone-ar body,
    html.mobile-ar,
    html.mobile-ar body {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      transform: none !important;
    }

    html.iphone-ar #arjs-video,
    html.iphone-ar video,
    html.iphone-ar .a-canvas,
    html.iphone-ar canvas,
    html.iphone-ar a-scene,
    html.mobile-ar #arjs-video,
    html.mobile-ar video,
    html.mobile-ar .a-canvas,
    html.mobile-ar canvas,
    html.mobile-ar a-scene {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      min-width: 100vw !important;
      min-height: 100vh !important;
      min-height: 100dvh !important;
      margin: 0 !important;
      padding: 0 !important;
      max-width: none !important;
      max-height: none !important;
      border: none !important;
    }

    html.iphone-ar video,
    html.mobile-ar video {
      object-fit: cover !important;
      object-position: center center !important;
      z-index: -2 !important;
    }
  </style>
</head>
<!-- Cerminkan seluruh tampilan agar video kamera dan objek AR tetap sejajar. -->
<body style="margin:0; overflow:hidden; transform: scaleX(-1);">
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="colorManagement: true; antialias: true">
    <!-- Pencahayaan: dua jenis lampu sesuai rubrik -->
    <a-light id="cahaya-ambient" type="ambient" color="#ffffff" intensity="0.6"></a-light>
    <a-light id="cahaya-directional" type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <!-- Semua objek ditempelkan pada marker Hiro -->
    <a-marker id="marker-hiro" preset="hiro">
      <!-- Alas transparan -->
      <a-plane id="alas-scene" position="0 0 0" rotation="-90 0 0"
        width="2" height="2" material="color: #e9e5fa; opacity: 0.7; transparent: true"></a-plane>

      <!-- Kelompok objek utama -->
      <a-entity id="kelompok-objek" position="0 0 0">
        <!-- Kubus biru di sebelah kiri -->
        <a-box id="kubus-biru" position="-0.6 0.25 0"
          width="0.5" height="0.5" depth="0.5" color="#4C6EF5"
          rotation="0 0 0"></a-box>

        <!-- Bola oranye di tengah, material semi-metal -->
        <a-sphere id="bola-oranye" position="0 0.3 0" radius="0.3"
          color="#D9531E" material="metalness: 0.3; roughness: 0.4"
          animation="property: position; dir: alternate; to: 0 0.5 0; dur: 1500; loop: true; easing: easeInOutSine"></a-sphere>

        <!-- Silinder hijau berputar pada sumbu Y -->
        <a-cylinder id="silinder-hijau" position="0.6 0.3 0"
          radius="0.2" height="0.6" color="#0B7F73"
          animation="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
          <!-- Penanda agar rotasi terlihat -->
          <a-box id="penanda-silinder" position="0 0.15 0.2" width="0.08" height="0.08" depth="0.08" color="#FDE047"></a-box>
        </a-cylinder>

        <!-- Kotak dengan tekstur dari folder assets -->
        <a-box id="kotak-bertekstur" position="0 0.15 0.7"
          width="0.5" height="0.3" depth="0.5"
          material="src: url(assets/tekstur.jpg); repeat: 1 1"></a-box>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
